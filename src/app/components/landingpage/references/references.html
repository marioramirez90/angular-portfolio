<section class="references-section">
  <div class="references-background">
    <img src="img/backgrounds/green-shadow.svg" alt="references-background">
  </div>
  <div class="references">

    <div class="reference-icon">
      <img src="img/icons/apostrop.svg" alt="Anführungszeichen">
    </div>

    <div class="content">
      <div class="reference-text">
        <div class="titel-references-container">
          <p>{{ references[currentIndex]?.descriptionKey | translate }}</p>
        </div>
        <div class="reference-name">
          <div class="line"></div>
          <p>{{ references[currentIndex]?.name }} - {{ 'REFERENCES.TEAM_PARTNER' | translate }}</p>
        </div>
      </div>

      <div class="image-container">
        <div class="image">
          <img
            [src]="references[currentIndex]?.img"
            alt="{{ references[currentIndex]?.name }}"
          />
        </div>
        <div class="line"></div>
      </div>
    </div>

    <div class="slider">
      <button
        (click)="prev()"
        (mouseenter)="leftHover=true"
        (mouseleave)="leftHover=false"
        [attr.aria-label]="'REFERENCES.PREV' | translate"
      >
        <img [src]="leftHover ? 'img/icons/hover-left.svg' : 'img/icons/links.svg'" alt="" />
      </button>

      <div class="dots">
        @for (ref of references; track $index; let i = $index) {
          <span class="dot" [class.active]="i === currentIndex"></span>
        }
      </div>

      <button
        (click)="next()"
        (mouseenter)="rightHover=true"
        (mouseleave)="rightHover=false"
        [attr.aria-label]="'REFERENCES.NEXT' | translate"
      >
        <img [src]="rightHover ? 'img/icons/hover-right.svg' : 'img/icons/rechts.svg'" alt="" />
      </button>
    </div>

  </div>
</section>
